# Baho Neza theme. Supported theme options carry the design; src/dashboard/theme.py adds only owned-class CSS.
[theme]
base = "light"
primaryColor = "#1B4B73"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
linkColor = "#1B4B73"
borderColor = "#D9E1E7"
showWidgetBorder = true
dataframeBorderColor = "#D9E1E7"
dataframeHeaderBackgroundColor = "#F7F9FB"
font = "sans serif"
baseFontSize = 16
headingFontSizes = ["32px", "22px", "18px"]
headingFontWeights = [700, 650, 600]
baseRadius = "8px"

[server]
# Serves src/dashboard/static (the maps' base topology) so maps render without reaching cdn.plot.ly.
enableStaticServing = true

[client]
toolbarMode = "minimal"
