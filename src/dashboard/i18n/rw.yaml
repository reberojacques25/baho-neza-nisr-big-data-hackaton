  hidden_cell: Byahishwe
  samples_note: "Umubare w'ingo zabajijwe zishingirwaho na buri mubare. 'Byahishwe' bivuze munsi ya {n}, cyangwa byahishwe kugira ngo hirindwe undi mubare."
