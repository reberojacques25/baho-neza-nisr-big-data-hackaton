  unsupported_title: Ibidashyigikiwe
  no_poverty_change: "Ubukene nyuma y'ubufasha: ntibugereranywa (nta ivugurura ryemejwe ry'umurongo w'ubukene cyangwa uko ikoreshwa ryahinduka)."
