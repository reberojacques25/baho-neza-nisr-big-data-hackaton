action:
  cash:
    name: New cash transfer
    help: A cash payment to a planning group you choose, at an amount you set.
  ds_expansion:
    name: Expand VUP Direct Support
    help: Uses the validated coverage-expansion scenario. New households come from those without any VUP support.
  nsds_increase:
    name: Increase NSDS payments
    help: Raises payments for current NSDS households. A benefit increase alone adds no recipients.
  public_works:
    name: Paid public works
    why: Gross wages could be counted, but the extra earnings net of work people would have done otherwise are not known.
  school_costs:
    name: School-cost support
    why: Programme rules (which costs, which learners) are not defined, and learners are not households.
  food_assistance:
    name: Food assistance
    why: No programme rules or valuation of in-kind food are available.
  livelihoods:
    name: Training, farming or business support
    why: There is no evidence in the data on the returns to these programmes.
  combined:
    name: Combined packages
    why: Overlaps between programmes are not calculated, so recipients could be counted twice.

