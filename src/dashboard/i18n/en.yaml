    meaning: What it means
    example: A simple example
    support: What the support changes
    limitation: One important limitation
  price:
    tested_simple: "You tested all prices rising by {increase_all_pct} over the next {horizon_months}, on top of {baseline_month} prices, in {place}. This is an extra rise in prices, not a change in the yearly inflation rate."
    tested_detailed: "You tested separate price rises over the next {horizon_months}, on top of {baseline_month} prices, in {place}: food {increase_food_pct}, energy and fuel {increase_energy_pct}, transport {increase_transport_pct}, school costs {increase_education_pct} and other goods {increase_other_pct}. These are extra rises in prices, not changes in the yearly inflation rate."
    meaning: "The same basket would cost {basket_change_pct} more: about {extra_monthly_rwf} more per household per month, on average (today's basket: {reference_monthly_rwf}). If incomes stay the same, the same money buys about {purchasing_power_loss_pct} less. For all {households} households here, the extra cost is about {extra_monthly_total_rwf} per month."
    example_simple: "Example, the average household in {place}: the basket costs {example_budget_rwf} a month today and {example_new_rwf} after the price change, so {example_extra_rwf} more every month."
    example_detailed: "Example, the average household in {place}: the basket costs {example_budget_rwf} a month today and {example_new_rwf} after these price changes, so {example_extra_rwf} more every month. Households that spend more on the categories that rise most would pay more."
  support:
    tested: "Programme tested: {programme}, in {place}. Recipients: {recipient_group}. Payment: {payment}. Period: {duration_months} ({payments} payments). Prices: {price_scenario}."
    meaning_new: "{new_recipient_households} additional households ({new_recipient_people} people) would receive support; {poor_recipient_households} of these households were below the poverty line in the 2023/24 survey (observed, not predicted). Transfers would cost {direct_transfers_rwf}; with delivery costs of {delivery_costs_rwf}, the total is {total_cost_rwf}."
    meaning_existing: "No additional households are added: {existing_recipient_households} households already receiving NSDS would receive more; {poor_recipient_households} of them were below the poverty line in the 2023/24 survey (observed). Transfers would cost {direct_transfers_rwf}; with delivery costs of {delivery_costs_rwf}, the total is {total_cost_rwf}."
    changes: "On average, each recipient household faces {extra_monthly_rwf} of extra cost per month from the price change and receives {support_monthly_rwf} of support per month, leaving {not_offset_monthly_rwf} per month not covered. Support does not lower market prices."
    example: "Illustration: over {duration_months}, one recipient household would receive {example_per_household_rwf} in total ({payments} payments)."
  limit:
    not_forecast: "This is a scenario, not a forecast: it shows what the same basket would cost if prices rose as entered."
    no_substitution: It assumes households keep buying the same goods; switching to cheaper goods would lower the extra cost.
    incomes_fixed: It assumes incomes stay the same in money terms.
    survey_age: Households are as surveyed in 2023/24; the survey is not a live register.
    no_poverty_change: It does not estimate how many people would leave poverty; it counts who would be reached and what it would cost.
    averages: Figures are group averages; some households would still face a shortfall.
    not_eligibility: Planning groups use estimated poverty likelihood or distress; they are not an eligibility decision.
    national_rule: "This is this place's share of a national expansion: households are ranked across all of Rwanda."

# Compact result layout: chips, KPI labels, charts and one-sentence summaries
