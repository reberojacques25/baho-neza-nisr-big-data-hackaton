how:
  title: How it works
  question: Four building blocks, each with a clear job and clear limits.
  poverty:
    title: Poverty model
    body: Estimates how likely a household is to be below the poverty line, from survey answers. Used to compare places and to rank planning groups.
    not: "The poverty model is not an eligibility decision and does not show what a policy would cause."
  price:
    title: Household price-shock engine
    body: Prices each household's own basket with the official urban or rural CPI, by spending category, then adds the increases you enter.
    not: "The price engine does not forecast prices and ignores households switching to cheaper goods."
  distress:
    title: Distress score
    body: Combines overlapping needs (price shock, food share, poverty, income instability, savings and credit) into one ranking. High need is the top fifth.
    not: "The distress score is a ranking device; scenarios never ask you to raise it, and it is not re-scored under a scenario."
  coverage:
    title: VUP coverage model
    body: Describes which high-need profiles VUP reached in 2023/24, kept separate from observed participation.
    not: "Low predicted coverage is not proof that anyone was wrongly excluded."
  tech_title: Technical details
  tech:
    holdout_title: Model accuracy on the holdout (scored once)
    holdout_note: "Final holdout: {n} households, one survey cluster in five, never used for training or tuning. Intervals: cluster bootstrap."
    measure: Measure
    value: Value
    metric:
      poverty_roc_auc: "Poverty model: ROC-AUC"
      poverty_pr_auc: "Poverty model: PR-AUC"
      poverty_precision_top20: "Poverty model: share of selected households that are poor (top 20%)"
      poverty_poor_people_reached_top20: "Poverty model: share of poor people reached (top 20%)"
      poverty_calibration_slope: "Poverty model: calibration slope"
      vup_roc_auc: "VUP coverage model: ROC-AUC"
      vup_pr_auc: "VUP coverage model: PR-AUC"
    crossfit_title: Simulation statistics (cross-fitted, full sample)
    crossfit_note: "These come from out-of-fold scores on all 15,054 households, as used in the scenarios. They are reported separately from the holdout results and are not a second test."
    units_title: Households and people
    units: "Precision counts households (how many of those selected are poor). Poor people reached counts people (how many poor people live in the selected households). The two are not interchangeable."
    calibration_title: Calibration
    calibration: "The poverty model is recalibrated by group so that average predictions match observed poverty by province, area, disability and other groups. This corrects averages only; errors within groups remain."
    fairness_title: Fairness limitations
    fairness: |
      - With one national cut-off, small households, Kigali and young heads of household are reached far less often (19–54% of their poor people, against 66% overall).
      - Recalibration does not change this; a different selection policy would.
      - The VUP coverage model's results by group are imprecise (few recipients in the sample).
    sources_title: Data sources
    sources: |
      - NISR EICV7 household survey, 2023/24: 15,054 households.
      - NISR Consumer Price Index, urban and rural, January 2024 to {latest}.
      - District boundaries: geoBoundaries (CC BY 4.0).
    survey_age_title: Age of the survey
    survey_age: "Households were interviewed between October 2023 and October 2024. Prices are updated to {latest}, but households, incomes and programme membership are not."
    cpi_title: How prices are mapped
    cpi: "Each of 25 spending cells is priced with one official NISR index for the household's area (urban or rural). Where rural indices do not exist, the closest rural index is used. Districts have no separate price indices."
    scenarios_title: Scenario assumptions
    scenarios: |
      - Scenario increases are applied on top of {latest} prices; the observed change since January 2024 is counted once.
      - Incomes stay the same in money terms.
      - Households do not switch to cheaper goods.
      - Recipients are households as surveyed; nobody joins or leaves.
    ai_title: Use of AI
    ai: "Parts of the code and text were drafted with an AI assistant and reviewed by the team. The Kinyarwanda text was machine-drafted and still needs review by a native speaker."
  disclaimer: Planning estimates. Not for automatic beneficiary selection.

data:
  title: Data & limitations
  question: What the numbers are, and what they are not.
  kinds_title: Three kinds of numbers
  kind:
    survey: Measured from the EICV7 survey or official prices, with survey uncertainty.
    model: Predicted by a statistical model from survey answers. Useful for comparing, not for deciding about a household.
    scenario: Calculated from your assumptions. Shows what could happen if the assumptions held.
  not_register: "The survey describes households as they were in 2023/24. It is not a live register, and figures updated for prices are not today's observed poverty."
  privacy_title: How small groups are protected
  privacy: |
    - Only aggregated figures are published; the app never loads household records.
    - Values from fewer than {n} survey households are hidden.
    - A second cell is hidden wherever totals minus other published cells could reveal a hidden one (urban + rural, districts within Rwanda, pairs of groups).
    - Nested planning groups (top 10%, 20%, 30%) are hidden when the difference between them would isolate fewer than {n} survey households.
    - These rules have not been reviewed or approved by NISR.
  supported_title: Supported scenarios
  unsupported_title: Not supported
  no_poverty_change: "Poverty after support: not estimated (no validated poverty-line update or consumption response)."
  translation_title: Translation status
  translation: "The Kinyarwanda text was machine-drafted and has not yet been reviewed by a native speaker. Please report unclear wording."
  samples_title: Survey households by district
  hidden_cell: Hidden
  samples_note: "Number of survey households behind each figure. 'Hidden' means fewer than {n}, or hidden to protect another cell."
  disclaimer: Planning estimates. Official eligibility and verification still apply.

