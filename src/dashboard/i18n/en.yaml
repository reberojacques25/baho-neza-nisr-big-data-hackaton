    assumptions: |
      - Starting point: prices in {latest}, the latest CPI month. The change since {base} is already in today's basket cost.
      - Incomes and other resources stay the same in money terms. Changing earnings is not offered: the survey does not measure income reliably enough.
      - Poverty changes and income shortfalls are not shown: they would need a validated poverty-line update and household responses.
      - Households switching to cheaper goods, gains for farm households that sell food, and wider effects on jobs and businesses are left out.
